name: tests

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Smoke tests (offline)
        run: pytest -m smoke

      - name: QAForge run with HTML report
        env:
          BASE_URL: https://www.saucedemo.com
        run: python -m qaforge run
        continue-on-error: true

      - name: Upload test reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaforge-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
